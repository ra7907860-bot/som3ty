<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    :root {
      --primary-color: #ff6b81;
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --text-color: #2f3542;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      margin: 40px 0 20px 0;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #747d8c;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 300px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card p {
      margin-top: 10px;
      font-weight: bold;
    }

    .message-section {
      background: var(--card-bg);
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .footer-note {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-top: 20px;
      font-weight: bold;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ff4757;
    }
  </style>
</head>

<body>

  <header>
    <h1>Happy Birthday! ❤️</h1>
    <p class="subtitle">كل سنة وأنتي طيبة وبخير دايماً ✨</p>
  </header>

  <!-- معرض الصور -->
  <section class="gallery">
    <div class="card">
      <img src="photo1.jpg" alt="صورة 1">
      <p>أجمل لحظة ❤️</p>
    </div>
    <div class="card">
      <img src="photo2.jpg" alt="صورة 2">
      <p>ذكريات حلوة ✨</p>
    </div>
  </section>

  <!-- قسم الرسالة -->
  <section class="message-section">
    <h2>رسالة خاصة 💌</h2>
    <p style="margin: 15px 0; line-height: 1.8;">
      كل سنة وأنتي طيبة وبخير، أتمنى لك سنة جديدة مليانة نجاح وسعادة وكل حاجة حلوة تتمنيها! 🎉✨
    </p>
    <button onclick="showSurprise()">اضغطي هنا للمفاجأة 🎉</button>
    <div class="footer-note">Made with ❤️ by Rodina</div>
  </section>

  <!-- مكتبة الاحتفال (Confetti) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    function showSurprise() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>

</body>
</html>
